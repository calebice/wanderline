[project]
name = "wanderline-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "boto3>=1.39,<2",
  "pillow>=11,<12",
  "pillow-heif>=1,<2",
  "opencv-python-headless>=4.12,<5",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
